version: 2

# https://docs.socket.dev/docs/socket-yml

issues:
  cve:
    action: error
  malware:
    action: error
  protestware:
    action: error
  new-author:
    action: warn
  install-scripts:
    action: warn
  telemetry:
    action: warn

# kxco-post-quantum — maintained by this organisation.
# @noble/* — Paul Miller's cryptography suite. hashes was audited by Cure53 in Jan 2022,
# curves and ciphers by Cure53 in Sep 2024. @noble/post-quantum was NOT
# audited by anyone: self-audited by its maintainer only.
ignore:
  - "kxco-post-quantum"
  - "@noble/post-quantum"
  - "@noble/hashes"
  - "@noble/ciphers"
  - "@noble/curves"
